- id: ui-sidebar-browser
  # Desktop capability does not depend on the user's Profile name. The later
  # user patch can still disable the Browser explicitly.
  disabled: false
- insert:
    - id: desktop-next-capabilities
      name: dsh-desktop-next
    # Computer Use (Next) keeps its registry in a realm of its own, so the
    # official Computer Use bundle can mount its registry beside it.
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
      isolate:
        computerUse: computer-use-next
    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
      disabled: true
      isolate:
        computerUse: computer-use-next
# Upstream mounts its Desktop product analytics for every Profile named
# `desktop` and reports to DeepSeek's collector by default. DSH Desktop does
# not take part in that collection. Its exporter also requires the upstream
# Electron shell's DSH_CLIENT_VERSION, which Next never provides.
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
# 云大师's own Host plugin: the account, the key and the model routes. It is
# installed as a `file:` tarball rather than a workspace, so this row is the
# only thing that mounts it; the package's own cordis.patch.yml is not
# consumed by any bundle here.
- insert:
    - id: yunwork-platform
      name: '@yundashi/dsh-yunwork-platform'
      config: {}
- id: ui-brand-official
  disabled: true
# The upstream DeepSeek account plugin speaks the `/auth-api/v0/dsh/*` protocol.
# Against the yundashi gateway `auth_init` answers 200 with a body its schema
# rejects (`errorCode: 'protocol'`), so the sidebar's native login can only end
# in "登录失败". The yunwork platform provides its own sign-in page and model
# routes against `/api/desktop-auth/*`, which is what this deployment serves.
# Disabled here — in the bundle layer that every Profile applies unconditionally —
# rather than in a user home patch, so a packaged build behaves like dev.
- id: ui-settings-account
  disabled: true
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-account-notifications
  disabled: true
